<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Explorer · dpointgroup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Libre+Baskerville:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #0a0a0a;
            --white: #fafafa;
            --gray-900: #171717;
            --gray-700: #404040;
            --gray-500: #737373;
            --gray-300: #a3a3a3;
            --gray-100: #f5f5f5;
            --border: #e5e5e5;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: var(--white);
            color: var(--black);
            min-height: 100vh;
            line-height: 1.6;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 24px;
        }
        .emblem {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 48px;
        }
        .emblem-mark {
            width: 40px;
            height: 40px;
            border: 2px solid var(--black);
            border-radius: 50%;
            position: relative;
        }
        .emblem-mark::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--black);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .emblem-text {
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            color: var(--black);
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: 1.75rem;
            font-weight: 400;
            color: var(--black);
            margin-bottom: 8px;
        }
        .header p {
            font-size: 0.9375rem;
            color: var(--gray-500);
        }
        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 32px;
        }
        .tab {
            padding: 14px 24px;
            background: none;
            color: var(--gray-500);
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-size: 0.9375rem;
            font-weight: 500;
            font-family: inherit;
            transition: color 0.2s, border-color 0.2s;
        }
        .tab:hover {
            color: var(--gray-700);
        }
        .tab.active {
            color: var(--black);
            border-bottom-color: var(--black);
        }
        .card {
            background: var(--white);
            border: 1px solid var(--border);
            padding: 40px;
        }
        .card h2 {
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: 1.25rem;
            font-weight: 400;
            color: var(--black);
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--gray-700);
            letter-spacing: 0.01em;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            background: var(--white);
            font-size: 1rem;
            font-family: inherit;
            color: var(--black);
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--gray-700);
        }
        input[type="text"]::placeholder {
            color: var(--gray-300);
        }
        .file-input-wrapper {
            position: relative;
        }
        .file-input-label {
            display: block;
            padding: 32px 24px;
            border: 1px dashed var(--border);
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            background: var(--gray-100);
        }
        .file-input-label:hover {
            border-color: var(--gray-500);
            background: var(--white);
        }
        .file-input-label .primary {
            font-size: 0.9375rem;
            color: var(--gray-700);
        }
        .file-input-label .hint {
            margin-top: 8px;
            font-size: 0.8125rem;
            color: var(--gray-500);
        }
        input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        #file-name {
            margin-top: 10px;
            font-size: 0.875rem;
            color: var(--gray-700);
        }
        .btn {
            width: 100%;
            padding: 16px 24px;
            background: var(--black);
            color: var(--white);
            border: none;
            font-size: 0.9375rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.88;
        }
        .btn:disabled {
            background: var(--gray-500);
            cursor: not-allowed;
            opacity: 1;
        }
        .alert {
            padding: 14px 16px;
            margin-bottom: 20px;
            font-size: 0.875rem;
            border: 1px solid;
        }
        .alert-success {
            background: var(--gray-100);
            color: var(--gray-900);
            border-color: var(--gray-300);
        }
        .alert-error {
            background: var(--gray-100);
            color: var(--gray-900);
            border-color: var(--gray-500);
        }
        .alert-info {
            background: var(--gray-100);
            color: var(--gray-700);
            border-color: var(--border);
        }
        .preview-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            font-size: 0.8125rem;
        }
        .preview-table th,
        .preview-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .preview-table th {
            background: var(--gray-100);
            font-weight: 500;
            color: var(--gray-700);
        }
        .preview-table td {
            color: var(--gray-700);
        }
        #preview-section h3 {
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--gray-700);
            margin-top: 24px;
            margin-bottom: 8px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            padding: 20px;
            border: 1px solid var(--border);
            background: var(--white);
        }
        .stat-value {
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: 1.75rem;
            color: var(--black);
        }
        .stat-label {
            font-size: 0.8125rem;
            color: var(--gray-500);
            margin-top: 4px;
        }
        .dashboard-section h3 {
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--gray-700);
            margin-top: 24px;
            margin-bottom: 12px;
        }
        .intern-block {
            margin-top: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            background: var(--gray-100);
        }
        .intern-block h4 {
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--black);
        }
        .intern-block p {
            font-size: 0.8125rem;
            color: var(--gray-500);
            margin-top: 4px;
        }
        .intern-block ul {
            margin-top: 12px;
            list-style: none;
        }
        .intern-block li {
            font-size: 0.875rem;
            color: var(--gray-700);
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
        }
        .intern-block li:last-child {
            border-bottom: none;
        }
        .intern-block a {
            color: var(--black);
            text-decoration: underline;
        }
        .hidden {
            display: none;
        }
        .loading {
            text-align: center;
            padding: 48px 20px;
            color: var(--gray-500);
            font-size: 0.9375rem;
        }
        .spinner {
            border: 2px solid var(--border);
            border-top-color: var(--black);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .footer {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: center;
        }
        .footer .emblem-text {
            font-size: 0.875rem;
            color: var(--gray-500);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emblem">
            <div class="emblem-mark"></div>
            <span class="emblem-text">dpointgroup</span>
        </div>

        <div class="header">
            <h1>Market Explorer</h1>
            <p>CSV file sharing</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('upload')">Upload CSV</button>
            <button class="tab" onclick="showTab('dashboard')">Admin Dashboard</button>
        </div>

        <div id="upload-tab" class="card">
            <h2>Upload your CSV file</h2>
            <div id="upload-alerts"></div>
            <form id="upload-form">
                <div class="form-group">
                    <label for="intern-name">Your name (firstname_lastname_country)</label>
                    <input type="text" id="intern-name" placeholder="e.g. marta_kovacevic_france" required>
                </div>
                <div class="form-group">
                    <label>Select CSV file</label>
                    <div class="file-input-wrapper">
                        <label class="file-input-label" for="csv-file">
                            <span class="primary">Choose file or drag and drop</span>
                            <span class="hint">Filename must end with: products_YYYY_MM_DD.csv (e.g. products_2026_02_11.csv)</span>
                        </label>
                        <input type="file" id="csv-file" accept=".csv" required>
                    </div>
                    <div id="file-name"></div>
                </div>
                <div id="preview-section" class="hidden">
                    <h3>Preview</h3>
                    <div id="preview-content"></div>
                </div>
                <button type="submit" class="btn" id="upload-btn">Upload CSV</button>
            </form>
        </div>

        <div id="dashboard-tab" class="card hidden">
            <h2>Admin dashboard</h2>
            <div id="dashboard-content">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading…</p>
                </div>
            </div>
        </div>

        <footer class="footer">
            <span class="emblem-text">dpointgroup</span>
        </footer>
    </div>

    <script>
        let currentTab = 'upload';
        function showTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('upload-tab').classList.toggle('hidden', tab !== 'upload');
            document.getElementById('dashboard-tab').classList.toggle('hidden', tab !== 'dashboard');
            if (tab === 'dashboard') loadDashboard();
        }
        function showAlert(message, type) {
            const alertsDiv = document.getElementById('upload-alerts');
            const alert = document.createElement('div');
            alert.className = 'alert alert-' + (type || 'info');
            alert.textContent = message;
            alertsDiv.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }
        document.getElementById('csv-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('file-name').textContent = 'Selected: ' + file.name;
                previewFile(file);
            }
        });
        function previewFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const csv = e.target.result;
                const lines = csv.split('\n').slice(0, 11);
                const headers = lines[0].split(',');
                let table = '<table class="preview-table"><thead><tr>';
                headers.forEach(h => { table += '<th>' + h.trim() + '</th>'; });
                table += '</tr></thead><tbody>';
                lines.slice(1, 6).forEach(line => {
                    table += '<tr>';
                    line.split(',').forEach(cell => { table += '<td>' + cell.trim() + '</td>'; });
                    table += '</tr>';
                });
                table += '</tbody></table>';
                document.getElementById('preview-content').innerHTML = table;
                document.getElementById('preview-section').classList.remove('hidden');
            };
            reader.readAsText(file);
        }
        document.getElementById('upload-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const internName = document.getElementById('intern-name').value;
            const fileInput = document.getElementById('csv-file');
            const file = fileInput.files[0];
            if (!file) {
                showAlert('Please select a CSV file', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = async function(e) {
                const csvContent = e.target.result;
                const btn = document.getElementById('upload-btn');
                btn.disabled = true;
                btn.textContent = 'Uploading…';
                try {
                    const response = await fetch('/api/upload', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: file.name, csv_content: csvContent, intern_name: internName })
                    });
                    
                    // Check for gateway/timeout errors before parsing
                    if (response.status >= 500 || response.status === 0) {
                        showAlert(`Server error (${response.status}). The server may be temporarily unavailable. Please try again in a moment.`, 'error');
                        return;
                    }
                    
                    const text = await response.text();
                    let data;
                    try {
                        if (!text || text.trim() === '') {
                            showAlert(`Server error (${response.status}). Empty response from server. Please try again.`, 'error');
                            return;
                        }
                        data = JSON.parse(text);
                    } catch (parseError) {
                        // Server returned non-JSON - show what we got for debugging
                        const preview = text.length > 100 ? text.substring(0, 100) + '...' : text;
                        showAlert(`Server error (${response.status}). Unexpected response format. Response: "${preview}"`, 'error');
                        console.error('Non-JSON response (full):', text);
                        console.error('Parse error:', parseError);
                        return;
                    }
                    if (data.success) {
                        showAlert('Uploaded: ' + file.name, 'success');
                        document.getElementById('upload-form').reset();
                        document.getElementById('file-name').textContent = '';
                        document.getElementById('preview-section').classList.add('hidden');
                    } else {
                        showAlert('Error: ' + (data.error || (data.errors ? data.errors.join('; ') : 'Unknown error')), 'error');
                    }
                } catch (err) {
                    showAlert('Upload failed: ' + err.message, 'error');
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Upload CSV';
                }
            };
            reader.readAsText(file);
        });
        async function loadDashboard() {
            try {
                const response = await fetch('/api/files?action=list');
                const data = await response.json();
                
                let html = '<div class="stats">';
                html += '<div class="stat-card"><div class="stat-value">' + data.interns.length + '</div><div class="stat-label">Total interns</div></div>';
                html += '<div class="stat-card"><div class="stat-value">' + data.total_files + '</div><div class="stat-label">Total files</div></div></div>';
                
                // Show error if present
                if (data.error) {
                    html += '<div class="alert alert-error">Error loading files: ' + data.error + '</div>';
                }
                
                html += '<div class="dashboard-section"><h3>Intern files</h3>';
                if (data.interns && data.interns.length > 0) {
                    data.interns.forEach(intern => {
                        html += '<div class="intern-block"><h4>' + intern.name + '</h4><p>Files: ' + intern.file_count + '</p>';
                        if (intern.files && intern.files.length) {
                            html += '<ul>';
                            intern.files.forEach(file => {
                                html += '<li>' + file.filename + ' <a href="/api/files?action=download&path=' + encodeURIComponent(file.path) + '">Download</a></li>';
                            });
                            html += '</ul>';
                        }
                        html += '</div>';
                    });
                } else {
                    html += '<p style="color: var(--gray-500); padding: 20px;">No files found. Upload a CSV file to get started.</p>';
                }
                html += '</div>';
                document.getElementById('dashboard-content').innerHTML = html;
            } catch (err) {
                document.getElementById('dashboard-content').innerHTML = '<div class="alert alert-error">Error loading dashboard: ' + err.message + '</div>';
            }
        }
    </script>
</body>
</html>
